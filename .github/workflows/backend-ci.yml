name: Backend CI

on:
  push:
    paths:
      - 'starter/backend/**'
  pull_request:
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd starter/backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest || true

      - name: Lint code
        run: |
          cd starter/backend
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Tests
        run: |
          cd starter/backend
          pytest || true

  build-check:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image (Dry Run)
        run: |
          cd starter/backend
          docker build -t backend:ci .